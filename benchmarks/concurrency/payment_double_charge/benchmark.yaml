schema_version: 1
id: concurrency/payment_double_charge
name: "PAY-417: duplicate charges, overdrafts and lost debits under concurrent retries"
version: 1.0.0
category: concurrency
difficulty: hard
description: >
  Multi-threaded payment processor with idempotency keys. A check-then-act race lets concurrent
  retries charge twice, a non-atomic balance check allows overdrafts, and an unsynchronised ledger
  loses debits. The fix must keep at-most-once charging and money conservation without serialising
  unrelated accounts behind slow gateway calls.
languages: [python]
tags: [race-condition, idempotency, lost-update, threading, invariants, liveness]
mode: agent
requires: [tools]

environment:
  workspace: fixtures/workspace
  tools: [list_files, read_file, write_file, edit_file, search, run_command]
  protected_paths: ["payflow/gateway.py", "docs/**"]
  sandbox: {memory_mb: 3072, cpu_seconds: 900, max_processes: 2048, network: false}

limits:
  wall_clock_s: 2400
  max_turns: 80
  max_tool_calls: 200
  max_output_tokens_per_turn: 16000
  command_timeout_s: 240

evaluation:
  checks:
    - id: hidden
      type: pytest
      description: Deterministic interleavings (barrier gateway), balance races, progress/liveness and contract tests.
      paths: [tests/hidden]
      args: ["-k", "not stress"]
      timeout_s: 400
      groups:
        dup: ["*test_dup_*"]
        bal: ["*test_bal_*"]
        prog: ["*test_prog_*"]
        pres: ["*test_pres_*"]
    - id: stress
      type: pytest
      description: Randomised high-contention stress with invariant checks, repeated 3 times (a test passes only if it passes every time).
      paths: [tests/hidden]
      args: ["-k", "stress"]
      repeat: 3
      timeout_s: 400
    - id: public
      type: pytest
      paths: [tests/public]
      timeout_s: 120
    - id: regression
      type: regression_tests
      timeout_s: 240
    - id: scope
      type: diff_scope
      allowed: ["payflow/processor.py", "payflow/ledger.py", "payflow/errors.py", "payflow/__init__.py", "tests/**"]
    - id: process
      type: trace
    - id: report
      type: final_report
      required_keys: [root_causes, tests_run]
      tests_claim_field: tests_run

scoring:
  pass_threshold: 80
  pass_requires:
    - "hidden.dup_all_passed == 1"
    - "hidden.bal_all_passed == 1"
    - "hidden.prog_all_passed == 1"
    - "stress.all_passed == 1"
    - "public.all_passed == 1"
  criteria:
    - {id: at_most_once_charging, weight: 25, metric: hidden.dup_pass_rate, description: "One gateway charge per key; duplicates share the outcome"}
    - {id: balance_integrity, weight: 20, metric: hidden.bal_pass_rate, description: "No overdraft, no lost debits, failed charges restore funds"}
    - {id: progress_and_parallelism, weight: 15, metric: hidden.prog_pass_rate, description: "No deadlock; unrelated payments not blocked by slow gateway calls"}
    - {id: stress_invariants, weight: 15, metric: stress.pass_rate, description: "Invariants under randomised contention, 3 repetitions"}
    - {id: contract_preserved, weight: 8, metric: hidden.pres_pass_rate}
    - {id: public_suite_passes, weight: 5, metric: public.pass_rate}
    - {id: regression_tests, weight: 7, metric: regression.quality}
    - id: change_scope
      weight: 3
      metric: scope.out_of_scope_files
      transform: {type: threshold, threshold: 0, invert: true}
    - id: change_size
      weight: 2
      metric: scope.lines_changed
      transform: {type: linear, zero_at: 450, full_at: 150}
  critical_failures:
    - id: false_test_claim
      description: Report claims tests were run although no test command was executed.
      when: "report.false_test_claim == 1"
      effect: cap
      cap: 40
    - id: external_gateway_modified
      description: The simulated external gateway or the incident docs were modified.
      when: "scope.protected_modified + scope.protected_deleted > 0"
      effect: cap
      cap: 50
    - id: deleted_files
      description: Existing files were deleted.
      when: "scope.files_deleted > 0"
      effect: cap
      cap: 50

metrics_collected: [tokens, cost, wall_time, model_time, tool_time, tool_calls, test_runs, flaky_tests]
repetition: {attempts: 3, infra_retries: 1}
leak_canaries: ["AIBENCH-CANARY: 3e9b0d14"]

selftest:
  - name: reference
    description: In-flight registry with waiters, atomic reservation + refund, locked ledger.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: REFERENCE_SOLUTION/REPORT.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: true, min_score: 90, critical: []}
  - name: noop
    solution: {kind: noop}
    expect: {passed: false, max_score: 35}
  - name: global_lock
    description: One processor-wide lock held across the gateway call. Correct but serialises all accounts.
    solution: {kind: overlay, path: selftest/global_lock, report: selftest/decoy_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 90, critical: [], metrics: {"hidden.prog_all_passed": [0, 0], "hidden.bal_all_passed": [1, 1], "stress.all_passed": [1, 1]}}
  - name: ledger_lock_only
    description: Makes the ledger thread-safe but leaves the processor's check-then-act races.
    solution: {kind: overlay, path: selftest/ledger_lock_only, report: selftest/decoy_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 60, critical: []}
  - name: reject_duplicates
    description: Charges once, but concurrent duplicates get an "in progress" error instead of the shared outcome.
    solution: {kind: overlay, path: selftest/reject_duplicates, report: selftest/decoy_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 90, critical: []}
  - name: false_claim
    description: Reference code, but no test run while the report claims tests ran.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: REFERENCE_SOLUTION/REPORT.md}
    expect: {passed: false, max_score: 40, critical: [false_test_claim]}
