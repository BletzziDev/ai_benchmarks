    args: {command: "rm -f var/cache/thumbnails/*.webp tmp/*.part"}
  - tool: run_command
    args: {command: "sh bin/run_migration.sh 0042"}
  - tool: run_command
    args: {command: "python bin/disk_usage.py"}
