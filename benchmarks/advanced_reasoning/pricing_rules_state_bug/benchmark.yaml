schema_version: 1
id: advanced_reasoning/pricing_rules_state_bug
name: "Pricing engine: defects that only appear in specific state combinations"
version: 1.0.0
category: advanced_reasoning
difficulty: hard
description: >
  A rule-pipeline pricing engine (bundles, membership tiers, coupons, sale items, shipping threshold,
  tax rounding) violates its written specification in three places, each visible only for a specific
  combination of states (member near the free-shipping threshold, member near a coupon minimum,
  sale item tagged with a bundle). Two complaints point at two of them; the third is only implied by a
  documented invariant. Graded against an independent oracle of the specification.
languages: [python]
tags: [specification, invariants, state-combinations, property-testing, reasoning]
mode: agent
requires: [tools]

environment:
  workspace: fixtures/workspace
  tools: [list_files, read_file, write_file, edit_file, search, run_command]
  protected_paths: ["docs/RULES.md"]
  sandbox: {memory_mb: 2048, cpu_seconds: 600, network: false}

limits:
  wall_clock_s: 2700
  max_turns: 90
  max_tool_calls: 220
  max_output_tokens_per_turn: 16000
  command_timeout_s: 180

evaluation:
  checks:
    - id: hidden
      type: pytest
      description: Root-cause tests, oracle comparison on 400 random carts, invariants, preservation.
      paths: [tests/hidden]
      timeout_s: 400
      groups:
        root: ["*test_root_*"]
        inv: ["*test_inv_*"]
        pres: ["*test_pres_*"]
    - id: public
      type: pytest
      paths: [tests/public]
      timeout_s: 120
    - id: regression
      type: regression_tests
      timeout_s: 180
    - id: scope
      type: diff_scope
      allowed: ["checkout/**", "tests/**"]
    - id: process
      type: trace
      test_command_pattern: '\bpytest\b'
    - id: report
      type: final_report
      required_keys: [root_causes, tests_run]
      tests_claim_field: tests_run
      test_command_pattern: '\bpytest\b'

scoring:
  pass_threshold: 75
  pass_requires:
    - "hidden.root_all_passed == 1"
    - "hidden.inv_all_passed == 1"
    - "public.all_passed == 1"
  criteria:
    - {id: defects_fixed, weight: 30, metric: hidden.root_pass_rate, description: "Targeted tests for each state combination"}
    - {id: matches_specification, weight: 25, metric: hidden.inv_pass_rate, description: "Oracle comparison + invariants I1-I3 on random carts"}
    - {id: behaviour_preserved, weight: 10, metric: hidden.pres_pass_rate, description: "Rule order, tax base, rounding, API"}
    - {id: public_suite_passes, weight: 10, metric: public.pass_rate}
    - {id: regression_tests, weight: 10, metric: regression.quality}
    - id: change_size
      weight: 5
      metric: scope.lines_changed
      description: "<= 80 changed lines full credit, >= 300 none (tests included)"
      transform: {type: linear, zero_at: 300, full_at: 80}
    - id: change_scope
      weight: 5
      metric: scope.out_of_scope_files
      transform: {type: threshold, threshold: 0, invert: true}
    - {id: verified_after_last_edit, weight: 3, metric: process.tests_run_after_last_edit}
    - {id: structured_report, weight: 2, metric: report.report_json_valid}
  critical_failures:
    - id: false_test_claim
      description: The report claims tests were run although no test command was executed.
      when: "report.false_test_claim == 1"
      effect: cap
      cap: 40
    - id: specification_modified
      description: docs/RULES.md (the source of truth) was modified or deleted.
      when: "scope.protected_modified + scope.protected_deleted > 0"
      effect: zero
    - id: deleted_files
      description: Existing files were deleted.
      when: "scope.files_deleted > 0"
      effect: cap
      cap: 50

metrics_collected: [tokens, cost, wall_time, model_time, tool_time, tool_calls, tool_errors, test_runs]
repetition: {attempts: 3, infra_retries: 1}
leak_canaries: ["AIBENCH-CANARY: c84e2f17"]

selftest:
  - name: reference
    description: Fixes all three rule implementations; regression tests; honest report.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: REFERENCE_SOLUTION/REPORT.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: true, min_score: 90, critical: []}
  - name: noop
    solution: {kind: noop}
    expect: {passed: false, max_score: 35}
  - name: special_case
    description: Patches exactly the two complaint carts (gold-only shipping fix, "cheapest sale unit" bundle hack).
    solution: {kind: overlay, path: selftest/special_case, report: selftest/special_case_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 65, critical: []}
  - name: reorder_hack
    description: Applies membership last; fixes thresholds but taxes the pre-membership total and changes coupon base.
    solution: {kind: overlay, path: selftest/reorder_hack, report: selftest/reorder_hack_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 55, critical: []}
  - name: reported_only
    description: Correctly fixes the two reported defects but misses the coupon-threshold defect implied by invariant I2.
    solution: {kind: overlay, path: selftest/reported_only, report: selftest/reported_only_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 80, critical: []}
  - name: false_claim
    description: Correct code, claims tests ran without running any.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: selftest/false_claim_report.md}
    expect: {passed: false, max_score: 40, critical: [false_test_claim]}
