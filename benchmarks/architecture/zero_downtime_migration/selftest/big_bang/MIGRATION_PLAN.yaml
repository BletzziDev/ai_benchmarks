steps:
  - {id: s1, action: add_column, column: first_name, nullable: false, default: ""}
  - {id: s2, action: add_column, column: last_name, nullable: false, default: ""}
  - {id: s3, action: backfill, direction: name_to_split}
  - {id: s4, action: deploy, version: v2, reads: split, writes: [split]}
  - {id: s5, action: drop_column, column: name}
