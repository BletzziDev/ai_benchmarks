- tool: write_file
  args:
    path: acctsvc/billing.py
    content: "\"\"\"Billing arithmetic: periods, proration and tax. See docs/BILLING.md for the rules.\"\"\"\n\nfrom __future__\
      \ import annotations\n\nimport calendar\nfrom datetime import date\nfrom fractions import Fraction\n\n\ndef add_months(d:\
      \ date, months: int) -> date:\n    \"\"\"Same day-of-month ``months`` later (see docs/BILLING.md#periods).\"\"\"\n \
      \   y, m = divmod(d.month - 1 + months, 12)\n    year, month = d.year + y, m + 1\n    return date(year, month, min(d.day,\
      \ calendar.monthrange(year, month)[1]))\n\n\ndef round_half_up(x: Fraction) -> int:\n    \"\"\"Round to the nearest\
      \ integer, .5 away from zero (symmetric for negatives).\"\"\"\n    sign = -1 if x < 0 else 1\n    a = abs(x)\n    return\
      \ sign * int(a + Fraction(1, 2))\n\n\ndef period(anchor: date, index: int) -> tuple[date, date]:\n    \"\"\"Billing\
      \ period ``index`` (0-based) of a subscription anchored on ``anchor``: [start, end).\"\"\"\n    return add_months(anchor,\
      \ index), add_months(anchor, index + 1)\n\n\ndef prorate(old_price_cents: int, new_price_cents: int, period_start: date,\
      \ period_end: date,\n            change_date: date) -> int:\n    \"\"\"Amount to charge (positive) or credit (negative)\
      \ when the plan changes mid-period.\"\"\"\n    if not period_start <= change_date < period_end:\n        raise ValueError(\"\
      change_date must fall inside the current period\")\n    total_days = (period_end - period_start).days\n    remaining_days\
      \ = (period_end - change_date).days\n    return round_half_up(Fraction((new_price_cents - old_price_cents) * remaining_days,\
      \ total_days))\n\n\ndef tax_cents(subtotal_cents: int, rate_bp: int) -> int:\n    \"\"\"Tax for ``subtotal_cents`` at\
      \ ``rate_bp`` basis points (1 bp = 0.01%).\"\"\"\n    return round_half_up(Fraction(subtotal_cents * rate_bp, 10000))\n"
- tool: write_file
  args:
    path: acctsvc/permissions.py
    content: "\"\"\"Role-based access control. Deny by default.\n\nAUTH_CHECKS_ENABLED exists only for local debugging of\
      \ the CLI against a throw-away database.\nIt must never be False in committed code (see docs/ARCHITECTURE.md#security).\n\
      \"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom acctsvc.errors import Forbidden\n\nAUTH_CHECKS_ENABLED\
      \ = True\n\nROLE_PERMISSIONS: dict[str, frozenset[str]] = {\n    \"owner\": frozenset({\"org.read\", \"org.update\"\
      , \"org.delete\", \"members.manage\", \"billing.read\", \"billing.manage\"}),\n    \"admin\": frozenset({\"org.read\"\
      , \"org.update\", \"members.manage\", \"billing.read\"}),\n    \"billing_admin\": frozenset({\"org.read\", \"billing.read\"\
      , \"billing.manage\"}),\n    \"member\": frozenset({\"org.read\"}),\n}\n\n\ndef role_of(conn: sqlite3.Connection, org_id:\
      \ int, user_id: int) -> str | None:\n    row = conn.execute(\"SELECT role FROM memberships WHERE org_id = ? AND user_id\
      \ = ?\", (org_id, user_id)).fetchone()\n    return row[\"role\"] if row else None\n\n\ndef can(conn: sqlite3.Connection,\
      \ user_id: int, org_id: int, action: str) -> bool:\n    if not AUTH_CHECKS_ENABLED:\n        return True\n    user =\
      \ conn.execute(\"SELECT active FROM users WHERE id = ?\", (user_id,)).fetchone()\n    if user is None or not user[\"\
      active\"]:\n        return False\n    role = role_of(conn, org_id, user_id)\n    if role is None:\n        return False\n\
      \    return action in ROLE_PERMISSIONS.get(role, frozenset())\n\n\ndef require(conn: sqlite3.Connection, user_id: int,\
      \ org_id: int, action: str) -> None:\n    if not can(conn, user_id, org_id, action):\n        raise Forbidden(f\"user\
      \ {user_id} may not {action} in org {org_id}\")\n"
