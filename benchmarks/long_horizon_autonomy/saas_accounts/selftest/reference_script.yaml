- tool: write_file
  args:
    path: acctsvc/users.py
    content: "\"\"\"User accounts.\n\nEmail addresses identify users and must be unique. See docs/ARCHITECTURE.md#users.\n\
      \"\"\"\n\nfrom __future__ import annotations\n\nimport re\nimport sqlite3\n\nfrom acctsvc.db import utcnow\nfrom acctsvc.errors\
      \ import Conflict, NotFound\n\nEMAIL_RE = re.compile(r\"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$\")\n\n\ndef create_user(conn:\
      \ sqlite3.Connection, email: str, full_name: str, now: str | None = None) -> int:\n    email = normalize_email(email)\n\
      \    full_name = \" \".join(full_name.split())\n    if not EMAIL_RE.match(email):\n        raise ValueError(f\"invalid\
      \ email: {email!r}\")\n    if not full_name:\n        raise ValueError(\"full_name is required\")\n    if conn.execute(\"\
      SELECT 1 FROM users WHERE lower(email) = ?\", (email,)).fetchone():\n        raise Conflict(f\"a user with email {email}\
      \ already exists\")\n    first, last = split_name(full_name)\n    cur = conn.execute(\"INSERT INTO users(email, first_name,\
      \ last_name, created_at, active) VALUES (?, ?, ?, ?, 1)\",\n                       (email, first, last, now or utcnow()))\n\
      \    return int(cur.lastrowid)\n\n\ndef normalize_email(email: str) -> str:\n    \"\"\"Emails are case-insensitive (docs/ARCHITECTURE.md#users);\
      \ stored lower-cased.\"\"\"\n    return email.strip().lower()\n\n\ndef split_name(full_name: str) -> tuple[str, str]:\n\
      \    \"\"\"First whitespace-separated token, and the rest single-space joined ('' if none).\"\"\"\n    parts = full_name.split()\n\
      \    return (parts[0], \" \".join(parts[1:])) if parts else (\"\", \"\")\n\n\ndef get_user(conn: sqlite3.Connection,\
      \ user_id: int) -> sqlite3.Row:\n    row = conn.execute(\"SELECT * FROM users WHERE id = ?\", (user_id,)).fetchone()\n\
      \    if row is None:\n        raise NotFound(f\"user {user_id}\")\n    return row\n\n\ndef get_user_by_email(conn: sqlite3.Connection,\
      \ email: str) -> sqlite3.Row | None:\n    # Rows created before ACC-104 may have mixed-case emails, so compare case-insensitively.\n\
      \    return conn.execute(\"SELECT * FROM users WHERE lower(email) = ? ORDER BY id LIMIT 1\",\n                     \
      \   (normalize_email(email),)).fetchone()\n\n\ndef display_name(conn: sqlite3.Connection, user_id: int) -> str:\n  \
      \  u = get_user(conn, user_id)\n    return f\"{u['first_name']} {u['last_name']}\".strip()\n\n\ndef deactivate_user(conn:\
      \ sqlite3.Connection, user_id: int) -> None:\n    get_user(conn, user_id)\n    conn.execute(\"UPDATE users SET active\
      \ = 0 WHERE id = ?\", (user_id,))\n\n\ndef list_users(conn: sqlite3.Connection, active_only: bool = True) -> list[sqlite3.Row]:\n\
      \    sql = \"SELECT * FROM users\" + (\" WHERE active = 1\" if active_only else \"\") + \" ORDER BY id\"\n    return\
      \ list(conn.execute(sql))\n"
- tool: write_file
  args:
    path: acctsvc/orgs.py
    content: "\"\"\"Organisations and memberships.\n\nInvariant (docs/ARCHITECTURE.md#organisations): every organisation always\
      \ has at least one\nmember with role ``owner``. Every operation that removes or demotes an owner must preserve it.\n\
      \"\"\"\n\nfrom __future__ import annotations\n\nimport sqlite3\n\nfrom acctsvc import audit\nfrom acctsvc.db import\
      \ utcnow\nfrom acctsvc.errors import Conflict, LastOwnerError, NotFound, SeatLimitExceeded\nfrom acctsvc.permissions\
      \ import require\nfrom acctsvc.plans import get_plan\n\nROLES = (\"owner\", \"admin\", \"billing_admin\", \"member\"\
      )\n\n\ndef _target(org_id: int, user_id: int | None = None) -> str:\n    return f\"org:{org_id}\" if user_id is None\
      \ else f\"org:{org_id}/user:{user_id}\"\n\n\ndef get_org(conn: sqlite3.Connection, org_id: int) -> sqlite3.Row:\n  \
      \  row = conn.execute(\"SELECT * FROM orgs WHERE id = ?\", (org_id,)).fetchone()\n    if row is None:\n        raise\
      \ NotFound(f\"org {org_id}\")\n    return row\n\n\ndef create_org(conn: sqlite3.Connection, name: str, owner_id: int,\
      \ now: str | None = None) -> int:\n    name = name.strip()\n    if not name:\n        raise ValueError(\"organisation\
      \ name is required\")\n    if conn.execute(\"SELECT 1 FROM users WHERE id = ?\", (owner_id,)).fetchone() is None:\n\
      \        raise NotFound(f\"user {owner_id}\")\n    cur = conn.execute(\"INSERT INTO orgs(name, created_at) VALUES (?,\
      \ ?)\", (name, now or utcnow()))\n    org_id = int(cur.lastrowid)\n    conn.execute(\"INSERT INTO memberships(org_id,\
      \ user_id, role) VALUES (?, ?, 'owner')\", (org_id, owner_id))\n    audit.record(conn, owner_id, \"org.created\", _target(org_id),\
      \ {\"name\": name})\n    return org_id\n\n\ndef members(conn: sqlite3.Connection, org_id: int) -> list[sqlite3.Row]:\n\
      \    return list(conn.execute(\n        \"SELECT m.user_id, m.role, u.email FROM memberships m JOIN users u ON u.id\
      \ = m.user_id \"\n        \"WHERE m.org_id = ? ORDER BY m.user_id\", (org_id,)))\n\n\ndef owners(conn: sqlite3.Connection,\
      \ org_id: int) -> list[int]:\n    return [r[\"user_id\"] for r in conn.execute(\n        \"SELECT user_id FROM memberships\
      \ WHERE org_id = ? AND role = 'owner' ORDER BY user_id\", (org_id,))]\n\n\ndef member_count(conn: sqlite3.Connection,\
      \ org_id: int) -> int:\n    return int(conn.execute(\"SELECT COUNT(*) AS n FROM memberships WHERE org_id = ?\", (org_id,)).fetchone()[\"\
      n\"])\n\n\ndef seat_limit(conn: sqlite3.Connection, org_id: int) -> tuple[str, int | None]:\n    \"\"\"(plan name, seat\
      \ limit) for the org's current plan; orgs without a subscription are 'free'.\"\"\"\n    row = conn.execute(\"SELECT\
      \ plan FROM subscriptions WHERE org_id = ?\", (org_id,)).fetchone()\n    plan = get_plan(row[\"plan\"] if row else \"\
      free\")\n    return plan.name, plan.seats\n\n\ndef add_member(conn: sqlite3.Connection, org_id: int, user_id: int, role:\
      \ str = \"member\",\n               actor_id: int | None = None) -> None:\n    get_org(conn, org_id)\n    if role not\
      \ in ROLES:\n        raise ValueError(f\"unknown role {role!r}\")\n    if actor_id is not None:\n        require(conn,\
      \ actor_id, org_id, \"members.manage\")\n    if conn.execute(\"SELECT 1 FROM users WHERE id = ?\", (user_id,)).fetchone()\
      \ is None:\n        raise NotFound(f\"user {user_id}\")\n    if conn.execute(\"SELECT 1 FROM memberships WHERE org_id\
      \ = ? AND user_id = ?\", (org_id, user_id)).fetchone():\n        raise Conflict(f\"user {user_id} is already a member\
      \ of org {org_id}\")\n    plan, limit = seat_limit(conn, org_id)\n    if limit is not None and member_count(conn, org_id)\
      \ >= limit:\n        raise SeatLimitExceeded(plan, limit)\n    conn.execute(\"INSERT INTO memberships(org_id, user_id,\
      \ role) VALUES (?, ?, ?)\", (org_id, user_id, role))\n    audit.record(conn, actor_id, \"member.added\", _target(org_id,\
      \ user_id), {\"role\": role})\n\n\ndef change_role(conn: sqlite3.Connection, org_id: int, user_id: int, new_role: str,\n\
      \                actor_id: int | None = None) -> None:\n    if new_role not in ROLES:\n        raise ValueError(f\"\
      unknown role {new_role!r}\")\n    if actor_id is not None:\n        require(conn, actor_id, org_id, \"members.manage\"\
      )\n    row = conn.execute(\"SELECT role FROM memberships WHERE org_id = ? AND user_id = ?\", (org_id, user_id)).fetchone()\n\
      \    if row is None:\n        raise NotFound(f\"user {user_id} is not a member of org {org_id}\")\n    old_role = row[\"\
      role\"]\n    if old_role == new_role:\n        return\n    if old_role == \"owner\" and owners(conn, org_id) == [user_id]:\n\
      \        raise LastOwnerError(f\"user {user_id} is the last owner of org {org_id}\")\n    conn.execute(\"UPDATE memberships\
      \ SET role = ? WHERE org_id = ? AND user_id = ?\", (new_role, org_id, user_id))\n    audit.record(conn, actor_id, \"\
      member.role_changed\", _target(org_id, user_id), {\"from\": old_role, \"to\": new_role})\n\n\ndef remove_member(conn:\
      \ sqlite3.Connection, org_id: int, user_id: int, actor_id: int | None = None) -> None:\n    if actor_id is not None:\n\
      \        require(conn, actor_id, org_id, \"members.manage\")\n    row = conn.execute(\"SELECT role FROM memberships\
      \ WHERE org_id = ? AND user_id = ?\", (org_id, user_id)).fetchone()\n    if row is None:\n        raise NotFound(f\"\
      user {user_id} is not a member of org {org_id}\")\n    if row[\"role\"] == \"owner\" and owners(conn, org_id) == [user_id]:\n\
      \        raise LastOwnerError(f\"user {user_id} is the last owner of org {org_id}\")\n    conn.execute(\"DELETE FROM\
      \ memberships WHERE org_id = ? AND user_id = ?\", (org_id, user_id))\n    audit.record(conn, actor_id, \"member.removed\"\
      , _target(org_id, user_id), {\"role\": row[\"role\"]})\n\n\ndef delete_org(conn: sqlite3.Connection, org_id: int, actor_id:\
      \ int) -> None:\n    get_org(conn, org_id)\n    require(conn, actor_id, org_id, \"org.delete\")\n    conn.execute(\"\
      DELETE FROM memberships WHERE org_id = ?\", (org_id,))\n    conn.execute(\"UPDATE orgs SET deleted_at = ? WHERE id =\
      \ ?\", (utcnow(), org_id))\n    audit.record(conn, actor_id, \"org.deleted\", _target(org_id))\n"
- tool: write_file
  args:
    path: acctsvc/subscriptions.py
    content: "\"\"\"Subscriptions: one per organisation, anchored on its start date.\"\"\"\n\nfrom __future__ import annotations\n\
      \nimport sqlite3\nfrom datetime import date\n\nfrom acctsvc import audit, billing\nfrom acctsvc.errors import Conflict,\
      \ NotFound, SeatLimitExceeded\nfrom acctsvc.plans import get_plan\n\n\ndef subscribe(conn: sqlite3.Connection, org_id:\
      \ int, plan_name: str, start: date,\n              actor_id: int | None = None) -> int:\n    get_plan(plan_name)\n \
      \   if conn.execute(\"SELECT 1 FROM subscriptions WHERE org_id = ?\", (org_id,)).fetchone():\n        raise Conflict(f\"\
      org {org_id} already has a subscription\")\n    p_start, p_end = billing.period(start, 0)\n    cur = conn.execute(\n\
      \        \"INSERT INTO subscriptions(org_id, plan, anchor_date, period_index, period_start, period_end, status) \"\n\
      \        \"VALUES (?, ?, ?, 0, ?, ?, 'active')\",\n        (org_id, plan_name, start.isoformat(), p_start.isoformat(),\
      \ p_end.isoformat()))\n    audit.record(conn, actor_id, \"subscription.created\", f\"org:{org_id}\", {\"plan\": plan_name})\n\
      \    return int(cur.lastrowid)\n\n\ndef get_subscription(conn: sqlite3.Connection, org_id: int) -> sqlite3.Row:\n  \
      \  row = conn.execute(\"SELECT * FROM subscriptions WHERE org_id = ?\", (org_id,)).fetchone()\n    if row is None:\n\
      \        raise NotFound(f\"org {org_id} has no subscription\")\n    return row\n\n\ndef current_period(conn: sqlite3.Connection,\
      \ org_id: int) -> tuple[date, date]:\n    s = get_subscription(conn, org_id)\n    return date.fromisoformat(s[\"period_start\"\
      ]), date.fromisoformat(s[\"period_end\"])\n\n\ndef renew(conn: sqlite3.Connection, org_id: int) -> tuple[date, date]:\n\
      \    \"\"\"Advance to the next billing period.\"\"\"\n    s = get_subscription(conn, org_id)\n    idx = s[\"period_index\"\
      ] + 1\n    p_start, p_end = billing.period(date.fromisoformat(s[\"anchor_date\"]), idx)\n    conn.execute(\"UPDATE subscriptions\
      \ SET period_index = ?, period_start = ?, period_end = ? WHERE org_id = ?\",\n                 (idx, p_start.isoformat(),\
      \ p_end.isoformat(), org_id))\n    return p_start, p_end\n\n\ndef change_plan(conn: sqlite3.Connection, org_id: int,\
      \ new_plan: str, on_date: date,\n                actor_id: int | None = None) -> int:\n    \"\"\"Switch plans mid-period.\
      \ Returns the proration amount (cents) added to the next invoice.\"\"\"\n    s = get_subscription(conn, org_id)\n  \
      \  old = get_plan(s[\"plan\"])\n    new = get_plan(new_plan)\n    if old.name == new.name:\n        return 0\n    members\
      \ = conn.execute(\"SELECT COUNT(*) AS n FROM memberships WHERE org_id = ?\", (org_id,)).fetchone()[\"n\"]\n    if new.seats\
      \ is not None and members > new.seats:\n        raise SeatLimitExceeded(new.name, new.seats)\n    p_start, p_end = date.fromisoformat(s[\"\
      period_start\"]), date.fromisoformat(s[\"period_end\"])\n    amount = billing.prorate(old.monthly_price_cents, new.monthly_price_cents,\
      \ p_start, p_end, on_date)\n    conn.execute(\"UPDATE subscriptions SET plan = ? WHERE org_id = ?\", (new.name, org_id))\n\
      \    conn.execute(\n        \"INSERT INTO subscription_adjustments(org_id, description, amount_cents, invoiced) VALUES\
      \ (?, ?, ?, 0)\",\n        (org_id, f\"Proration {old.name} -> {new.name} from {on_date.isoformat()}\", amount))\n \
      \   audit.record(conn, actor_id, \"subscription.plan_changed\", f\"org:{org_id}\",\n                 {\"from\": old.name,\
      \ \"to\": new.name, \"proration_cents\": amount})\n    return amount\n"
