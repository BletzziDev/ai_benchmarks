schema_version: 1
id: bug_fixing/date_range_billing
name: "TICKET-5120: proration loses a day across DST transitions"
version: 1.0.0
category: bug_fixing
difficulty: medium
description: >
  Single-cause bug: calendar days are counted as elapsed UTC seconds // 86400, so any interval
  containing a 23-hour spring-forward day loses a day. Symptoms appear only for some months and
  timezones (both hemispheres). Tests root-cause isolation versus special-casing and plausible but
  wrong fixes (ceil), plus regression-test quality.
languages: [python]
tags: [root-cause, timezones, dst, off-by-one, regression-tests]
mode: agent
requires: [tools]

environment:
  workspace: fixtures/workspace
  tools: [list_files, read_file, write_file, edit_file, search, run_command]
  protected_paths: ["support/**"]
  sandbox: {memory_mb: 2048, cpu_seconds: 600, network: false}

limits:
  wall_clock_s: 1800
  max_turns: 60
  max_tool_calls: 150
  max_output_tokens_per_turn: 16000
  command_timeout_s: 180

evaluation:
  checks:
    - id: hidden
      type: pytest
      paths: [tests/hidden]
      timeout_s: 300
      groups:
        root: ["*test_root_*"]
        inv: ["*test_inv_*"]
        pres: ["*test_pres_*"]
    - id: public
      type: pytest
      paths: [tests/public]
      timeout_s: 120
    - id: regression
      type: regression_tests
      timeout_s: 180
    - id: scope
      type: diff_scope
      allowed: ["billing/**", "tests/**"]
    - id: process
      type: trace
      test_command_pattern: '\bpytest\b'
    - id: report
      type: final_report
      required_keys: [root_causes, tests_run]
      tests_claim_field: tests_run
      test_command_pattern: '\bpytest\b'

scoring:
  pass_threshold: 75
  pass_requires:
    - "hidden.root_all_passed == 1"
    - "public.all_passed == 1"
    - "hidden.inv_all_passed == 1"
  criteria:
    - {id: root_cause_fixed, weight: 35, metric: hidden.root_pass_rate, description: "DST day counts correct in both directions/hemispheres"}
    - {id: invariants_hold, weight: 15, metric: hidden.inv_pass_rate, description: "Calendar-day additivity and full-period price (property-based)"}
    - {id: behaviour_preserved, weight: 10, metric: hidden.pres_pass_rate, description: "Rounding, clipping, validation, API"}
    - {id: public_suite_passes, weight: 10, metric: public.pass_rate}
    - {id: regression_tests, weight: 15, metric: regression.quality}
    - id: change_size
      weight: 5
      metric: scope.lines_changed
      description: "<= 50 changed lines full credit, >= 200 none (tests included)"
      transform: {type: linear, zero_at: 200, full_at: 50}
    - id: change_scope
      weight: 5
      metric: scope.out_of_scope_files
      transform: {type: threshold, threshold: 0, invert: true}
    - {id: verified_after_last_edit, weight: 3, metric: process.tests_run_after_last_edit}
    - {id: structured_report, weight: 2, metric: report.report_json_valid}
  critical_failures:
    - id: false_test_claim
      description: The report claims tests were run although no test command was executed.
      when: "report.false_test_claim == 1"
      effect: cap
      cap: 40
    - id: protected_files_changed
      description: The support ticket (evidence) was modified or deleted.
      when: "scope.protected_modified + scope.protected_deleted > 0"
      effect: cap
      cap: 50
    - id: deleted_files
      description: Existing files were deleted.
      when: "scope.files_deleted > 0"
      effect: cap
      cap: 50

metrics_collected: [tokens, cost, wall_time, model_time, tool_time, tool_calls, tool_errors, test_runs]
repetition: {attempts: 3, infra_retries: 1}
leak_canaries: ["AIBENCH-CANARY: 3b91d0e4"]

selftest:
  - name: reference
    description: Date-based day count, regression tests, honest report.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: REFERENCE_SOLUTION/REPORT.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: true, min_score: 90, critical: []}
  - name: noop
    description: Untouched workspace (fall-back-month root tests already pass, hence a non-zero score).
    solution: {kind: noop}
    expect: {passed: false, max_score: 45}
  - name: ceil_patch
    description: Rounds elapsed days up; fixes spring-forward but breaks fall-back days.
    solution: {kind: overlay, path: selftest/ceil_patch, report: selftest/ceil_patch_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 75, critical: []}
  - name: special_case
    description: Special-cases March in the two ticket timezones.
    solution: {kind: overlay, path: selftest/special_case, report: selftest/special_case_report.md, run_commands: ["python -m pytest -q"]}
    expect: {passed: false, max_score: 60, critical: []}
  - name: false_claim
    description: Correct code, claims tests ran without running any.
    solution: {kind: overlay, path: REFERENCE_SOLUTION/files, report: selftest/false_claim_report.md}
    expect: {passed: false, max_score: 40, critical: [false_test_claim]}
