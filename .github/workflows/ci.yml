name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Contract validation
        run: benchmark validate
      - name: Framework tests (fast)
        run: python -m pytest -q -m "not slow and not docker"
      - name: Build docker sandbox image
        run: scripts/build_sandbox_image.sh
      - name: Docker sandbox tests
        run: python -m pytest -q -m docker
      - name: Grader selftests (all benchmarks)
        run: python -m pytest -q -m slow
